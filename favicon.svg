<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- USBメモリをイメージしたファビコン -->
  <!-- 金属コネクタ -->
  <rect x="22" y="2" width="20" height="18" rx="2" fill="#c7ced6" stroke="#6e7883" stroke-width="2"/>
  <rect x="27" y="7" width="10" height="5" rx="1" fill="#4a525b"/>
  <rect x="27" y="14" width="10" height="2" rx="1" fill="#8b95a1"/>
  <!-- 本体 (青いUSBメモリ) -->
  <rect x="15" y="20" width="34" height="42" rx="7" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
  <rect x="15" y="20" width="34" height="10" rx="5" fill="#42a5f5"/>
  <rect x="20" y="22" width="6" height="6" rx="1.5" fill="#bbdefb"/>
  <!-- USBマーク (白) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 36 v10"/>
    <circle cx="32" cy="34.5" r="1.6" fill="#ffffff" stroke="none"/>
    <path d="M32 41 L26 46"/>
    <path d="M32 41 L38 46"/>
    <circle cx="25" cy="47.5" r="1.8" fill="#ffffff" stroke="none"/>
    <path d="M38 46 v3.5" />
    <circle cx="38" cy="52" r="1.8" fill="#ffffff" stroke="none"/>
  </g>
  <!-- 差込口のライン -->
  <rect x="22" y="58" width="20" height="2.5" rx="1.2" fill="#0d47a1" opacity="0.6"/>
</svg>
